<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 48px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 20px; fill: #94a3b8; }
      .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
      
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-10px) scale(1.05); opacity: 0.8; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }
      @keyframes helixMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 100; }
      }
      .animated-bg-node { animation: floatPulse 6s ease-in-out infinite; }
      .helix-line { stroke-dasharray: 10, 10; animation: helixMove 20s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern Background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250" />
    <path d="M 100,0 L 100,300 M 200,0 L 200,300 M 300,0 L 300,300 M 400,0 L 400,300 M 500,0 L 500,300 M 600,0 L 600,300 M 700,0 L 700,300 M 800,0 L 800,300 M 900,0 L 900,300 M 1000,0 L 1000,300 M 1100,0 L 1100,300" />
  </g>

  <!-- Dynamic / Animated Background Graphics (Behind Text) -->
  <g class="animated-bg-node" opacity="0.5">
    <circle cx="950" cy="150" r="120" fill="none" stroke="url(#dnaGrad1)" stroke-width="1.5" stroke-dasharray="6, 6"/>
    <circle cx="950" cy="150" r="80" fill="none" stroke="url(#dnaGrad2)" stroke-width="1.5"/>
    <circle cx="950" cy="150" r="40" fill="#38bdf8" opacity="0.1"/>
  </g>

  <!-- DNA Strand Wave Effect (Background Right) -->
  <path d="M 750,90 Q 825,170 900,90 T 1050,90 T 1200,90" fill="none" stroke="url(#dnaGrad1)" stroke-width="3" opacity="0.6" class="helix-line"/>
  <path d="M 750,170 Q 825,90 900,170 T 1050,170 T 1200,170" fill="none" stroke="url(#dnaGrad2)" stroke-width="3" opacity="0.6" class="helix-line"/>

  <!-- Connecting Rungs -->
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.3">
    <line x1="787" y1="130" x2="787" y2="130"/>
    <line x1="825" y1="90" x2="825" y2="170"/>
    <line x1="862" y1="130" x2="862" y2="130"/>
    <line x1="900" y1="170" x2="900" y2="90"/>
    <line x1="937" y1="130" x2="937" y2="130"/>
    <line x1="975" y1="90" x2="975" y2="170"/>
    <line x1="1012" y1="130" x2="1012" y2="130"/>
    <line x1="1050" y1="170" x2="1050" y2="90"/>
  </g>

  <!-- Foreground Content (Text & Badges) -->
  <g transform="translate(70, 0)">
    <!-- Pill Category Badge -->
    <rect x="0" y="55" width="230" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="115" y="76" text-anchor="middle" class="badge-text">🧬 GENOMICS &amp; MULTI-OMICS</text>

    <!-- Main Title -->
    <text x="0" y="135" class="title" filter="url(#glow)">Awesome Genomics Data Platform</text>

    <!-- Subtitle -->
    <text x="0" y="175" class="subtitle">Curated SaaS products, cloud analytics workspaces &amp; open-source bioinformatic engines</text>

    <!-- Feature Tags -->
    <g transform="translate(0, 210)">
      <rect x="0" y="0" width="140" height="28" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="70" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="13">☁️ SaaS Workspaces</text>

      <rect x="150" y="0" width="160" height="28" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="230" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="13">⚡ Nextflow &amp; WDL Engines</text>

      <rect x="320" y="0" width="150" height="28" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <text x="395" y="18" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="13">🔬 Precision Medicine</text>
    </g>
  </g>
</svg>
